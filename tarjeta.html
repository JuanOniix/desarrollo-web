<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Tarjetas de presentación — Grid</title>
</head>
  <link rel="stylesheet" href="styles.css">
</head>
</head>
<body>
  <div class="container">
    <h1 class="page-title">Tarjetas de presentación</h1>
    <section class="grid" role="list">
      <article class="card" role="listitem" aria-label="Tarjeta Andrea Blanco">
        <div class="avatar" aria-hidden="true">AB</div>
        <h1>Andrea Blanco</h1>
        <h2>Desarrolladora Web</h2>
        <div class="info">
          <div class="small">📍 Barcelona, España</div>
          <div><a class="contact" href="mailto:andrea@example.com">andrea@example.com</a></div>
        </div>
        <div class="socials">
          <a href="#" title="LinkedIn">LinkedIn</a>
          <a href="#" title="GitHub">GitHub</a>
        </div>
      </article>

      <article class="card" role="listitem" aria-label="Tarjeta Carlos Ruiz">
        <div class="avatar" aria-hidden="true">CR</div>
        <h1>Carlos Ruiz</h1>
        <h2>Diseñador UX</h2>
        <div class="info">
          <div class="small">📍 Madrid, España</div>
          <div><a class="contact" href="mailto:carlos@example.com">carlos@example.com</a></div>
        </div>
        <div class="socials">
          <a href="#" title="Behance">Behance</a>
          <a href="#" title="Dribbble">Dribbble</a>
        </div>
      </article>

      <article class="card" role="listitem" aria-label="Tarjeta Laura Gómez">
        <div class="avatar" aria-hidden="true">LG</div>
        <h1>Laura Gómez</h1>
        <h2>Product Manager</h2>
        <div class="info">
          <div class="small">📍 Valencia, España</div>
          <div><a class="contact" href="mailto:laura@example.com">laura@example.com</a></div>
        </div>
        <div class="socials">
          <a href="#" title="LinkedIn">LinkedIn</a>
        </div>
      </article>
    </section>
  </div>
</body>
</html>
